[package]
name = "egui-clap-host"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
clack-host = { workspace = true }
clack-extensions = { workspace = true }
# VST3 音源のホスティング。VST3 SDK 3.8.0 が MIT になったことで使えるようになった。
# cpal バックエンドとプロセス分離は本体に同等の経路があるので既定機能を切る
# (C のツールチェーンも不要になる)。
#
# crates.io 版ではなくフォークを指す。エディタを開く経路に手元の音源の半分が
# 通らない箇所があり、上流待ちにできないため (docs/archive/vst3_host_plan.md のフェーズ6)。
# 版はここで固定しないが、Cargo.lock がコミットを固定するので再現性は保たれる。
vst3-host = { git = "https://github.com/TY17-write/rust-vst3-host.git", default-features = false }
cpal = "0.15"
crossbeam-channel = "0.5"
eframe = "0.31"
rtrb = "0.3"
rfd = "0.15"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
    # 埋め込んだ子ウィンドウが入力を受け取れる状態かを見るため (IsWindowEnabled)
    "Win32_UI_Input_KeyboardAndMouse",
    # クリップボードが空かを調べるため (IsClipboardFormatAvailable / CF_UNICODETEXT)
    "Win32_System_DataExchange",
    "Win32_System_Ole",
] }
# parallel (rayon) は不要なので既定機能を切る
midly = { version = "0.5.3", default-features = false, features = ["std", "alloc"] }
# CeVIO の .ccs 書き出し用 (どちらも純 Rust。C のビルド環境は不要)
quick-xml = "0.37"
uuid = { version = "1", features = ["v4"] }
# プロジェクトファイル (.ron) の読み書き
serde = { version = "1", features = ["derive"] }
ron = "0.8"
# 音源の状態 (不透明なバイト列) を .ron に載せるため
base64 = "0.22"
# Opus での書き出し。どちらも純 Rust で、C のビルド環境は要らない
# (libopus を直接使う道は CMake が要るので採らなかった)
opus-rs = "0.1"
ogg = "0.9"
