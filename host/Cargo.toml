[package]
name = "clap-host-test"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
clack-host = { workspace = true }
clack-extensions = { workspace = true }
cpal = "0.15"
crossbeam-channel = "0.5"
eframe = "0.31"
rtrb = "0.3"
rfd = "0.15"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }
# parallel (rayon) は不要なので既定機能を切る
midly = { version = "0.5.3", default-features = false, features = ["std", "alloc"] }
# CeVIO の .ccs 書き出し用 (どちらも純 Rust。C のビルド環境は不要)
quick-xml = "0.37"
uuid = { version = "1", features = ["v4"] }
# プロジェクトファイル (.ron) の読み書き
serde = { version = "1", features = ["derive"] }
ron = "0.8"
