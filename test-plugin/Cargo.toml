[package]
name = "test-plugin"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lints]
workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
clack-plugin = { workspace = true }
clack-extensions = { workspace = true }
# オーディオスレッドから GUI へサンプルを渡す輪
rtrb = "0.3"
# モニタの GUI (Win32 + GDI で自前に描く)
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }
